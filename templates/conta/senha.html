{% extends 'base.html' %}

{% block title %}Trocar Senha - Açougue{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">
        <i class="fas fa-key"></i> Trocar senha
    </h2>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('trocar_senha') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="senha_atual">Senha atual</label>
            <input type="password" id="senha_atual" name="senha_atual" class="form-control"
                   autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label for="nova_senha">Nova senha</label>
            <input type="password" id="nova_senha" name="nova_senha" class="form-control"
                   autocomplete="new-password" minlength="6" required>
            <small class="text-muted">Mínimo de 6 caracteres.</small>
        </div>
        <div class="form-group">
            <label for="confirmacao">Confirme a nova senha</label>
            <input type="password" id="confirmacao" name="confirmacao" class="form-control"
                   autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
    </form>
</div>
{% endblock %}
